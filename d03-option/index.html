<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splide ドキュメント</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/themes/splide-skyblue.min.css"
      crossorigin="anonymous"
    />
    <style>
      .splide__slide:nth-of-type(even) {
        background-color: lightblue;
      }
      .splide__slide:nth-of-type(odd) {
        background-color: lightyellow;
      }
    </style>
  </head>

  <body>
    <section class="splide" aria-label="Splideの基本的なHTML">
      <div class="splide__track">
        <ul class="splide__list">
          <li class="splide__slide">Slide 01</li>
          <li class="splide__slide">Slide 02</li>
          <li class="splide__slide">Slide 03</li>
          <li class="splide__slide">Slide 04</li>
          <li class="splide__slide">Slide 05</li>
          <li class="splide__slide">Slide 06</li>
          <li class="splide__slide">Slide 07</li>
        </ul>
      </div>
    </section>

    <script
      src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"
      integrity="sha256-FZsW7H2V5X9TGinSjjwYJ419Xka27I8XPDmWryGlWtw="
      crossorigin="anonymous"
    ></script>

    <script>
      new Splide('.splide', {
        // type: 'loop', // type 指定があると rewind が無効になる。
        // perPage: 3, // fixedWidth があると perPage は無効になる。
        perMove: 2,
        width: '80%',
        fixedWidth: 300,
        gap: '20px',
        speed: 5000,
        rewind: true, // 最後まで行くと一番前に戻る(loop は最後の次に一番前)
        rewindSpeed: 3000,
      }).mount();
    </script>
  </body>
</html>
