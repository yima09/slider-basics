<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splide ドキュメント</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css"
      integrity="sha256-5uKiXEwbaQh9cgd2/5Vp6WmMnsUr3VZZw0a8rKnOKNU="
      crossorigin="anonymous"
    />

    <style>
      .splide__progress__bar {
        background-color: pink;
      }
    </style>
  </head>

  <body>
    <section class="splide" aria-label="Splideの基本的なHTML">
      <div class="splide__track">
        <ul class="splide__list">
          <!-- 初期表示はインターバルの値は適用されない(インターバルなので) 500 は２周目で適用される -->
          <li class="splide__slide" data-splide-interval="500">Slide 01</li>
          <li class="splide__slide">Slide 02</li>
          <li class="splide__slide">Slide 03</li>
          <li class="splide__slide" data-splide-interval="1000">Slide 04</li>
          <li class="splide__slide">Slide 05</li>
          <li class="splide__slide">Slide 06</li>
          <li class="splide__slide">Slide 07</li>
          <li class="splide__slide">Slide 08</li>
          <li class="splide__slide">Slide 09</li>
        </ul>
      </div>

      <button class="splide__toggle" type="button">
        <span class="splide__toggle__play">Play</span>
        <span class="splide__toggle__pause">Pause</span>
      </button>

      <div class="splide__progress">
        <div class="splide__progress__bar"></div>
      </div>
    </section>

    <script
      src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"
      integrity="sha256-FZsW7H2V5X9TGinSjjwYJ419Xka27I8XPDmWryGlWtw="
      crossorigin="anonymous"
    ></script>

    <script>
      new Splide('.splide', {
        type: 'loop',
        autoplay: 'pause',
        perPage: 3,
      }).mount();
    </script>
  </body>
</html>
