<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splide ドキュメント</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css"
      integrity="sha256-5uKiXEwbaQh9cgd2/5Vp6WmMnsUr3VZZw0a8rKnOKNU="
      crossorigin="anonymous"
    />

    <style>
      .splide__list {
        gap: 16px;
      }

      .splide__slide {
        background-color: burlywood;
      }
    </style>
  </head>

  <body>
    <section class="splide" aria-label="Splideの基本的なHTML">
      <div class="splide__track">
        <ul class="splide__list">
          <li class="splide__slide" style="width: 150px">Slide 01</li>
          <li class="splide__slide" style="width: 250px">Slide 02</li>
          <li class="splide__slide" style="width: 200px">Slide 03</li>
          <li class="splide__slide" style="width: 150px">Slide 04</li>
          <li class="splide__slide" style="width: 250px">Slide 05</li>
          <li class="splide__slide" style="width: 200px">Slide 06</li>
          <li class="splide__slide" style="width: 150px">Slide 07</li>
          <li class="splide__slide" style="width: 250px">Slide 08</li>
          <li class="splide__slide" style="width: 200px">Slide 09</li>
        </ul>
      </div>
    </section>

    <script
      src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"
      integrity="sha256-FZsW7H2V5X9TGinSjjwYJ419Xka27I8XPDmWryGlWtw="
      crossorigin="anonymous"
    ></script>

    <script>
      new Splide('.splide', {
        type: 'loop',
        height: '10rem',
        focus: 'center',
        autoWidth: true,
        lazyLoad: true,
      }).mount();
    </script>
  </body>
</html>
